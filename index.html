<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>私のお城</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- １：廊下のシーン -->
    <div id="scene-1" class="scene-container active">
      <div class="scene-stage">
        <img src="img/1-corridor.jpeg" alt="廊下" class="scene-image" />
        <button
          class="click-area"
          style="top: 25%; left: 40%; width: 20%; height: 50%"
          data-scene="scene-2"
          title="扉を開ける"
        ></button>
      </div>
    </div>

    <!-- ２：ゲストルーム（全体）のシーン -->
    <div id="scene-2" class="scene-container">
      <div class="scene-stage">
        <img src="img/2-guest-room.jpeg" alt="ゲストルーム" class="scene-image" />
        <button
          class="click-area"
          style="top: 50%; left: 25%; width: 30%; height: 40%"
          data-scene="scene-3"
          title="テーブルに近づく"
        ></button>
      </div>
      <button class="nav-btn" data-scene="scene-4">
        くるりと後ろを振り向く
      </button>
    </div>

    <!-- ３：ケーキのテーブル（拡大）のシーン -->
    <div id="scene-3" class="scene-container">
      <div class="scene-stage">
        <img src="img/3-cake-table.png" alt="ケーキのテーブル" class="scene-image" />
      </div>
      <button class="nav-btn" data-scene="scene-2">
        一歩下がって部屋を見渡す
      </button>
    </div>

    <!-- ４：ソファのシーン -->
    <div id="scene-4" class="scene-container">
      <div class="scene-stage">
        <img src="img/4-couch.png" alt="ソファ" class="scene-image" />
        <button
          class="click-area"
          id="book-btn"
          style="top: 60%; left: 70%; width: 20%; height: 20%"
          title="読みかけの本"
        ></button>
      </div>
      <button class="nav-btn" data-scene="scene-2">
        くるりと後ろを振り向く
      </button>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
