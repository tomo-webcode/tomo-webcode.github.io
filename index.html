<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>My Hideaway</title>
    <!-- 本のページ用の文字（筆記体・手書き風） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pinyon+Script&family=Zen+Kurenaido&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- １：廊下のシーン -->
    <div id="scene-1" class="scene-container active">
      <div class="scene-stage">
        <img src="img/1-corridor.jpeg" alt="廊下" class="scene-image" />
        <button
          class="click-area"
          style="top: 25%; left: 40%; width: 20%; height: 50%"
          data-scene="scene-2"
          data-effect="approach"
          title="扉を開ける"
        ></button>
      </div>
    </div>

    <!-- ２：ゲストルーム（全体）のシーン -->
    <div id="scene-2" class="scene-container">
      <div class="scene-stage">
        <img
          src="img/2-guest-room.jpeg"
          alt="ゲストルーム"
          class="scene-image"
        />
        <button
          class="click-area"
          style="top: 50%; left: 25%; width: 30%; height: 40%"
          data-scene="scene-3"
          data-effect="approach"
          title="テーブルに近づく"
        ></button>
      </div>
      <button class="nav-btn" data-scene="scene-4" data-effect="turn">
        くるりと後ろを振り向く
      </button>
      <button
        class="nav-btn nav-back"
        data-scene="scene-1"
        data-effect="retreat"
      >
        廊下に戻る
      </button>
    </div>

    <!-- ３：ケーキのテーブル（拡大）のシーン -->
    <div id="scene-3" class="scene-container">
      <div class="scene-stage">
        <!-- ふだんの猫（座っている画像） -->
        <img
          src="img/3-cake-table.jpeg"
          alt="ケーキのテーブル"
          class="scene-image"
        />
        <!-- へそ天の猫（上に重ねておく画像） -->
        <img
          src="img/3-cake-table2.jpeg"
          alt="へそ天の猫"
          class="scene-image cat-belly-image"
        />
        <!-- 猫をクリックする透明なボタン -->
        <button
          class="click-area"
          id="cat-btn"
          style="top: 45%; left: 74%; width: 23%; height: 48%"
          title="猫をなでる"
        ></button>
      </div>
      <button class="nav-btn" data-scene="scene-2" data-effect="retreat">
        一歩下がって部屋を見渡す
      </button>
    </div>

    <!-- ４：ソファのシーン -->
    <div id="scene-4" class="scene-container">
      <div class="scene-stage">
        <img src="img/4-couch.png" alt="ソファ" class="scene-image" />

        <!-- ★追加：額縁の右端（長男）をクリックして科学者ページへ -->
        <button
          type="button"
          class="click-area"
          id="son-btn"
          style="top: 5%; left: 29%; width: 8%; height: 22%"
          title="大博士の部屋へ"
        ></button>

        <!-- 額縁の左端（長女）をクリックしてアニメ＆漫画の部屋へ -->
        <button
          type="button"
          class="click-area"
          id="daughter-btn"
          style="top: 5%; left: 17%; width: 12%; height: 22%"
          title="アニメ＆漫画の部屋へ"
        ></button>

        <button
          class="click-area"
          id="book-btn"
          style="top: 60%; left: 70%; width: 20%; height: 20%"
          title="読みかけの本"
        ></button>
      </div>
      <button class="nav-btn" data-scene="scene-2" data-effect="turn">
        くるりと後ろを振り向く
      </button>
    </div>

    <!-- ５：古い羊皮紙の本（合言葉のあとに開く） -->
    <div id="scene-5" class="scene-container book-scene">
      <div id="book-wrap" class="book-wrap">
        <div id="book" class="book"></div>
      </div>
      <button
        class="nav-btn nav-back"
        data-scene="scene-4"
        data-effect="retreat"
      >
        本を閉じる
      </button>
      <div class="book-controls">
        <button id="book-prev" class="nav-btn nav-inline" type="button">
          ‹ 前のページ
        </button>
        <span id="book-page-info" class="book-page-info"></span>
        <button id="book-next" class="nav-btn nav-inline" type="button">
          次のページ ›
        </button>
      </div>
    </div>

    <!-- 振り向くときに重ねる白いフェード用 -->
    <div id="flash-overlay"></div>

    <script>
      // 長女の部屋：額縁の左端から合言葉で入室
      document.getElementById("daughter-btn")?.addEventListener("click", function () {
        const answer = window.prompt("あなたの好きなものは？");
        if (answer === null) return;
        const normalized = answer.trim().replace(/\s+/g, "");
        if (["アニメ", "漫画", "まんが", "マンガ", "アニメや漫画", "アニメと漫画", "アニメ・漫画"].includes(normalized)) {
          window.location.href = "anime.html";
        } else {
          window.alert("あなたの好みにはあわないから、またね～ばいばい");
        }
      });

      // 大博士の部屋：ソファの部屋から合言葉で入室
      document.getElementById("son-btn")?.addEventListener("click", function () {
        const answer = window.prompt("大ちゃんの後ろについている人は誰でしょう？");
        if (answer === null) return;
        if (answer.trim() === "大博士") {
          window.location.href = "scientists.html";
        } else {
          window.alert("違いま～す！");
        }
      });
    </script>

    <script src="js/books.js"></script>
    <script src="js/book.js"></script>
    <script src="js/main.js"></script>
  
<script>
  async function sha256Hex(text) {
    const data = new TextEncoder().encode(text.normalize("NFKC").trim());
    const digest = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(digest))
      .map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function enterScientists() {
    const answer = prompt("大ちゃんの後ろについている人は誰でしょう？");
    if (answer === null) return;
    const hash = await sha256Hex(answer);
    if (hash === "879cf198bfb55d6b9d5f7123b11be6eb52e16c1f6cccc1c7adde329e18f7529d") {
      sessionStorage.setItem("hideaway_scientists_key", "ok");
      location.href = "scientists.html";
    } else {
      alert("違いま～す！");
    }
  }

  async function enterAnime() {
    const answer = prompt("あなたの好きなものは？");
    if (answer === null) return;
    let normalized = answer.normalize("NFKC").trim()
      .replace(/[・･、,。!！?？\s]/g, "");
    // 「アニメや漫画」「漫画とアニメ」なども、答えそのものはソースに置かず
    // 含まれる語をハッシュで判定する。
    const candidates = [
      normalized,
      ...normalized.split(/や|と|＆|&|または/)
    ].filter(Boolean);
    const hashes = await Promise.all(candidates.map(sha256Hex));
    const allowed = ["77affb05948a7dacda062e8e1a3ce008f1c3e1ed4b7f1f5ecfb515d47879b9f2", "8447fb0532d16687bebe7947f907803697130be1fd667f3d938626dbae1d2250", "0728628c3446ecfcd5b5238a5bcd58c59ccc6f7ceabb2dd00ebc5d9c9b3a39ad"];
    if (hashes.some(h => allowed.includes(h))) {
      sessionStorage.setItem("hideaway_anime_key", "ok");
      location.href = "anime.html";
    } else {
      alert("あなたの好みにはあわないから、またね～ばいばい");
    }
  }
</script>

</body>
</html>
