<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>私のお城</title>
    <style>
        body {
            background-color: #2c2c2c;
            text-align: center;
            margin: 0;
            padding: 20px;
            font-family: serif;
        }
        .scene-container {
            position: relative;
            display: inline-block;
            max-width: 1000px;
            display: none;
        }
        .scene-image {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .click-area {
            position: absolute;
            cursor: pointer;
            background: rgba(255, 255, 255, 0);
            border: none;
        }
        .click-area:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .nav-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 25px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: black;
        }
    </style>
</head>
<body>

    <!-- １：廊下のシーン -->
    <div id="scene-1" class="scene-container" style="display: inline-block;">
        <!-- 画像のパスを img/ から始まるように変更しました -->
        <img src="img/1-corridor.jpeg" alt="廊下" class="scene-image">
        <button class="click-area" style="top: 25%; left: 40%; width: 20%; height: 50%;" onclick="changeScene('scene-2')" title="扉を開ける"></button>
    </div>

    <!-- ２：ゲストルーム（全体）のシーン -->
    <div id="scene-2" class="scene-container">
        <img src="img/2-guest-room.jpeg" alt="ゲストルーム" class="scene-image">
        <button class="click-area" style="top: 50%; left: 25%; width: 30%; height: 40%;" onclick="changeScene('scene-3')" title="テーブルに近づく"></button>
        <button class="nav-btn" onclick="changeScene('scene-4')">くるりと後ろを振り向く</button>
    </div>

    <!-- ３：ケーキのテーブル（拡大）のシーン -->
    <div id="scene-3" class="scene-container">
        <img src="img/3-cake-table.png" alt="ケーキのテーブル" class="scene-image">
        <button class="nav-btn" onclick="changeScene('scene-2')">一歩下がって部屋を見渡す</button>
    </div>

    <!-- ４：ソファのシーン -->
    <div id="scene-4" class="scene-container">
        <img src="img/4-couch.png" alt="ソファ" class="scene-image">
        <button class="click-area" style="top: 60%; left: 70%; width: 20%; height: 20%;" onclick="checkPassword()" title="読みかけの本"></button>
        <button class="nav-btn" onclick="changeScene('scene-2')">くるりと後ろを振り向く</button>
    </div>

    <script>
        function changeScene(sceneId) {
            document.getElementById('scene-1').style.display = 'none';
            document.getElementById('scene-2').style.display = 'none';
            document.getElementById('scene-3').style.display = 'none';
            document.getElementById('scene-4').style.display = 'none';
            document.getElementById(sceneId).style.display = 'inline-block';
        }

        function checkPassword() {
            const password = prompt("秘密の部屋の鍵（合言葉）を入力してください：");
            if (password === "干し芋") { 
                alert("カチャッ…（この先の内面の部屋は、これから作ります！）");
            } else if (password !== null && password !== "") {
                alert("合言葉が違います。本は静かに閉じられたままです。");
            }
        }
    </script>

</body>
</html>
