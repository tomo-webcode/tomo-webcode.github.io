              ja: "おそらく私は、誰も量子力学を理解していないと安全に言えると思う。",
              src: "1964年のメッセンジャー講義を書籍化した『物理法則はいかにして成り立つか（The Character of Physical Law）』（1965年）第6章",
              kind: "一次",
              chk: "ok",
            },
          ],
        },
      ];
      const LN = {
        el: "古代ギリシア語",
        la: "ラテン語",
        en: "英語",
        de: "ドイツ語",
        fr: "フランス語",
        it: "イタリア語",
      };
      const CK = {
        ok: "済（二次資料経由）",
        part: "出典のみ確認・語句は未照合",
        no: "未照合",
      };
      const KN = {
        一次: ["k1", "本人の著作・書簡"],
        記録: ["k2", "本人の発言の記録"],
        伝承: ["", "後世の伝承・真偽に議論あり"],
      };
      function createFallbackSvg(enName, rank) {
        const initials = enName
          .split(" ")
          .map((w) => w[0])
          .join("")
          .slice(0, 3);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="210" height="260" viewBox="0 0 210 260">
          <defs>
            <radialGradient id="g" cx="50%" cy="40%" r="65%">
              <stop offset="0%" stop-color="#3a2a19"/>
              <stop offset="100%" stop-color="#140e08"/>
            </radialGradient>
          </defs>
          <rect width="210" height="260" fill="url(#g)"/>
          <rect x="10" y="10" width="190" height="240" fill="none" stroke="#c89d54" stroke-width="1" stroke-opacity="0.4"/>
          <circle cx="105" cy="95" r="34" fill="#c89d54" fill-opacity="0.18" stroke="#c89d54" stroke-opacity="0.4"/>
          <path d="M50,205 Q105,145 160,205" fill="#c89d54" fill-opacity="0.15" stroke="#c89d54" stroke-opacity="0.4"/>
          <text x="105" y="103" text-anchor="middle" fill="#e8dac0" font-family="Georgia, serif" font-size="22" letter-spacing="2">${initials}</text>
          <text x="105" y="232" text-anchor="middle" fill="#c89d54" font-family="serif" font-size="11" opacity="0.8">PORTRAIT ${rank}</text>
        </svg>`;
        return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
      }

      const toc = document.getElementById("toc"),
        root = document.getElementById("scientists-container");
      
      // 13人分に拡張されたローマ数字
      const R = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII"];
      
      function showQ(i, n) {
        const s = D[i],
          len = s.q.length,
          k = (n + len) % len,
          q = s.q[k],
          kd = KN[q.kind];
        const b = document.getElementById("bub-" + s.id);
        b.dataset.n = k;
        b.querySelector(".q-body").innerHTML =
          `<div class="bub-lang">${q.tr ? `英訳（原文は${LN[q.tr]}）` : `原文（${LN[q.lang]}）`}</div><div class="q-orig" lang="${q.lang}">“${q.orig}”</div>
           <div class="q-ja">「${q.ja}」</div>
           <div class="q-src"><span class="q-kind ${kd[0]}">${q.kind}</span>${kd[1]}／出典：${q.src}<br><span class="q-chk c-${q.chk}">原典照合：${CK[q.chk]}</span></div>`;
        b.querySelector(".q-count").textContent = `${k + 1} / ${len}`;
      }
      D.forEach((s, i) => {
        const a = document.createElement("a");
        a.href = "#" + s.id;
        a.className = "toc-btn";
        a.textContent = `${R[i]}. ${s.name}`;
        toc.appendChild(a);
        const el = document.createElement("article");
        el.className = "scientist-card";
        el.id = s.id;
        el.innerHTML = `
          <div class="stage">
            <div class="portrait-frame"><img src="${s.img}" alt="${s.name}の肖像" onerror="this.onerror=null;this.src='${createFallbackSvg(s.en, R[i])}';" /></div>
            <div class="bubble" id="bub-${s.id}" data-n="0">
              <div class="q-body"></div>
              <div class="q-nav"><button type="button" aria-label="前のセリフ">◀</button><span class="q-count"></span><button type="button" aria-label="次のセリフ">次のセリフ ▶</button></div>
            </div>
          </div>
          <div class="info">
            <div class="profile-col">
              <div class="rank-badge">DOCTOR ${R[i]}</div>
              <div class="dates-box">
                <div class="dates-row"><span class="dates-label">生誕</span><span>${s.born}</span></div>
                <div class="dates-row"><span class="dates-label">没</span><span>${s.died}</span></div>
                <div class="dates-row"><span class="dates-label">出身</span><span>${s.place}</span></div>
              </div>
              <div class="origin-note">※ ${s.note}</div>
            </div>
            <div class="content-col">
              <div class="name-header"><div class="field-tags">${s.fields.map((f) => `<span class="tag">${f}</span>`).join("")}</div>
                <h2 class="name-jp">${s.name}</h2><p class="name-en">${s.en}</p></div>
              <h3 class="section-heading">主な功績</h3>
              <ul class="achievements-list">${s.ach.map((x) => `<li>${x}</li>`).join("")}</ul>
              <div class="formula-box"><div class="formula-title">【定理・法則・代表的な数式】 ${s.ftitle}</div><div class="formula-content">${s.formula}</div></div>
              <h3 class="section-heading">素顔</h3>
              <p class="desc-text">${s.face}</p>
            </div>
          </div>`;
        root.appendChild(el);
        const bt = el.querySelectorAll(".q-nav button");
        bt[0].onclick = () =>
          showQ(i, +el.querySelector(".bubble").dataset.n - 1);
        bt[1].onclick = () =>
          showQ(i, +el.querySelector(".bubble").dataset.n + 1);
        showQ(i, 0);
      });
      window.addEventListener(
        "load",
        () =>
          window.MathJax && MathJax.typesetPromise && MathJax.typesetPromise(),
      );
    </script>
  </body>
</html>
