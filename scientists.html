        position: relative;
        text-align: center;
        padding: 60px 20px 40px;
        border-bottom: 1px solid var(--border-gold);

      .back-link {
        position: absolute;
        top: 20px;
        left: 20px;
        color: var(--gold);
        text-decoration: none;

        padding: 8px 16px;

        border-radius: 20px;
        font-family: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .toc-btn:hover {
        background: var(--gold);
        color: var(--bg-dark);
        transform: translateY(-2px);
      }

        margin: 40px auto 80px;
        padding: 0 20px;
        display: flex;
        flex-direction: column;

        height: 3px;
        background: linear-gradient(

          transparent,
          var(--gold),

        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 32px;
        padding: 36px;
      }

      .profile-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

        font-size: 0.85rem;
        color: var(--gold);
        letter-spacing: 0.15em;
        margin-bottom: 10px;

        width: 210px;
        height: 260px;

        border-radius: 4px;
        overflow: hidden;
        position: relative;
        background: #14100c;

        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: sepia(20%) contrast(105%);

        margin-bottom: 0;
        border-bottom: none;
        padding-bottom: 0;
      }

      .dates-label {
        color: var(--gold);

      }

        font-size: 0.72rem;
        color: #887862;
        font-family: monospace;

        flex-direction: column;
      }

        border-bottom: 1px solid var(--border-gold);

        margin-bottom: 18px;

      .field-tags {

        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }

        font-size: 0.75rem;
        padding: 2px 10px;
        background: rgba(200, 157, 84, 0.15);
        color: var(--gold-light);
        border: 1px solid rgba(200, 157, 84, 0.4);
        border-radius: 3px;

      .name-jp {
        font-size: 1.75rem;
        margin: 0;
        color: #fff6e5;
        line-height: 1.3;

        font-style: italic;
        font-size: 1.15rem;
        color: var(--parchment-dim);

        background: #17120d;
        border-left: 3px solid var(--gold);
        padding: 14px 20px;
        margin: 0 0 20px;
        border-radius: 0 6px 6px 0;
        overflow-x: auto;
      }

      .formula-title {
        font-size: 0.8rem;
        color: var(--gold);
        margin-bottom: 6px;
        letter-spacing: 0.08em;
      }

      .section-heading {
        font-size: 1.05rem;
        color: var(--gold-light);
        margin: 16px 0 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-heading::before {
        content: "◆";
        color: var(--gold);
        font-size: 0.8rem;
      }

      .desc-text {
        margin: 0 0 16px;
        font-size: 0.95rem;
        color: var(--parchment);

      .achievements-list li {

        font-size: 0.94rem;

      .achievements-list strong {
        color: #fff0d4;
        border-bottom: 1px dotted rgba(200, 157, 84, 0.5);

        color: var(--parchment-dim);

        border-top: 1px solid var(--border-gold);

      @media (max-width: 780px) {
        .card-inner {
          grid-template-columns: 1fr;
          padding: 24px 20px;
        }
        .back-link {
          position: static;
          display: inline-block;
          margin-bottom: 20px;
        }
      }
    </style>

      function createFallbackSvg(enName, rank) {
        const initials = enName
          .split(" ")
          .map((w) => w[0])
          .join("")
          .slice(0, 3);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="210" height="260" viewBox="0 0 210 260">
          <defs>
            <radialGradient id="g" cx="50%" cy="40%" r="65%">
              <stop offset="0%" stop-color="#3a2a19"/>
              <stop offset="100%" stop-color="#140e08"/>
            </radialGradient>
          </defs>
          <rect width="210" height="260" fill="url(#g)"/>
          <rect x="10" y="10" width="190" height="240" fill="none" stroke="#c89d54" stroke-width="1" stroke-opacity="0.4"/>
          <circle cx="105" cy="95" r="34" fill="#c89d54" fill-opacity="0.18" stroke="#c89d54" stroke-opacity="0.4"/>
          <path d="M50,205 Q105,145 160,205" fill="#c89d54" fill-opacity="0.15" stroke="#c89d54" stroke-opacity="0.4"/>
          <text x="105" y="103" text-anchor="middle" fill="#e8dac0" font-family="Georgia, serif" font-size="22" letter-spacing="2">${initials}</text>
          <text x="105" y="232" text-anchor="middle" fill="#c89d54" font-family="serif" font-size="11" opacity="0.8">PORTRAIT ${rank}</text>
        </svg>`;
        return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
      }

        const article = document.createElement("article");
        article.className = "scientist-card";
        article.id = s.id;

        const tagsHtml = s.fields

        const achievementsHtml = s.achievements
